<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวสร้างรหัสเปิดใช้งาน (เก็บไว้ในเครื่องคุณเท่านั้น)</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eef2f7;font-family:"Prompt","Noto Sans Thai",system-ui,-apple-system,Tahoma,sans-serif;color:#14213d;display:flex;justify-content:center;padding:24px 14px}
.box{width:100%;max-width:560px}
h1{font-size:20px;margin:0 0 12px;color:#303891}
.warn{background:#fff4e5;border:1px solid #f5c26b;color:#7a4a00;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(20,33,61,.08)}
label{display:block;font-size:13px;font-weight:500;color:#303891;margin:0 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid #c9cbd6;border-radius:12px;padding:11px 12px;outline:0;background:#fff;color:#14213d}
input{text-transform:uppercase;letter-spacing:1.5px}
textarea{resize:none;word-break:break-all;letter-spacing:0;text-transform:none;background:#f7f8fc}
input:focus,textarea:focus{border-color:#303891}
button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#303891;color:#fff;margin-top:12px}
button.s{background:#eceefb;color:#303891;margin-left:8px}
.e{color:#dc2626;font-size:13px;min-height:18px;margin-top:8px}
.ok{color:#0f766e}
.out{margin-top:16px}
</style>
</head>
<body>
<div class="box">
<h1>ตัวสร้างรหัสเปิดใช้งาน</h1>
<div class="warn"><b>เก็บไฟล์นี้ไว้ในเครื่องคุณเท่านั้น ห้ามอัปโหลดขึ้น GitHub หรือ Cloudflare</b><br>ไฟล์นี้มีกุญแจลับสำหรับสร้างรหัส ถ้าคนอื่นได้ไฟล์นี้ไป เขาจะสร้างรหัสให้ใครก็ได้ ควรสำรองไว้ในที่ปลอดภัย เพราะถ้าหาย จะต้องสร้างกุญแจใหม่และออกรหัสให้ทุกคนใหม่</div>
<div class="card">
<label for="did">รหัสเครื่องของเพื่อน (12 ตัว ใส่ขีดหรือไม่ใส่ก็ได้)</label>
<input id="did" type="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
<button id="go" type="button">สร้างรหัสเปิดใช้งาน</button>
<div class="e" id="err"></div>
<div class="out" id="out" style="display:none">
<label for="code">รหัสเปิดใช้งาน (ส่งให้เพื่อนทั้งก้อน)</label>
<textarea id="code" rows="4" readonly></textarea>
<button id="cp" type="button">คัดลอกรหัส</button>
</div>
</div>
</div>
<script>
var PRIV={"kty":"EC","crv":"P-256","x":"hTl0UnjwEL_eqd3cAjCd-lUyyo26hMvEqIIwO7_fcLA","y":"V5aYeKGohUurvq6txfmJdRv3tN3LzI7ubpooQflfmFE","d":"lUY9hlrZsxBZUpMrSgg3i-9QpdisI8WZBP1XQHsH-iw","ext":true};
var AB="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function u2b(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
var $=function(i){return document.getElementById(i)};
$("go").onclick=function(){
  var id=$("did").value.toUpperCase().replace(/[^A-Z0-9]/g,""),err=$("err");err.className="e";err.textContent="";$("out").style.display="none";
  if(id.length!==12||id.split("").some(function(c){return AB.indexOf(c)<0})){err.textContent="รหัสเครื่องต้องมี 12 ตัว (ตัวอักษร A-Z ยกเว้น I O กับเลข 2-9) ตรวจว่าคัดลอกมาครบ";return}
  if(!window.crypto||!crypto.subtle){err.textContent="เบราว์เซอร์นี้สร้างรหัสไม่ได้ ลองเปิดไฟล์นี้ด้วย Chrome หรือ Safari";return}
  crypto.subtle.importKey("jwk",PRIV,{name:"ECDSA",namedCurve:"P-256"},false,["sign"]).then(function(k){
    return crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},k,new TextEncoder().encode(id))
  }).then(function(sig){
    $("code").value=u2b(new Uint8Array(sig));$("out").style.display="block";err.className="e ok";err.textContent="สร้างรหัสสำหรับเครื่อง "+id.replace(/(.{4})(?=.)/g,"$1-")+" แล้ว"
  }).catch(function(e){err.textContent="สร้างรหัสไม่สำเร็จ: "+e.message});
};
$("cp").onclick=function(){var t=$("code"),b=this;t.select();var d=function(){b.textContent="คัดลอกแล้ว";setTimeout(function(){b.textContent="คัดลอกรหัส"},1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(d);else{document.execCommand("copy");d()}};
</script>
</body>
</html>
